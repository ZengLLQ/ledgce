[package]
name = "ledgce-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dotenvy = "0.15"
ledgce-application = { path = "../ledgce-application" }
ledgce-domain = { path = "../ledgce-domain" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1.54", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.29", features = ["v7"] }

[lints]
workspace = true
