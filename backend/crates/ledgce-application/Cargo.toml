[package]
name = "ledgce-application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
hex = "0.4.3"
ledgce-domain = { version = "0.1.0", path = "../ledgce-domain" }
metrics = "0.24.6"
rust_decimal = { version = "1.43.0", features = ["serde-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "rust_decimal", "migrate", "macros", "json"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "serde-well-known"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["uuid", "time"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
