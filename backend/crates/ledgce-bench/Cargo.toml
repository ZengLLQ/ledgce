[package]
name = "ledgce-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dotenvy = "0.15"
futures = "0.3"
hdrhistogram = "7.5"
ledgce-application = { path = "../ledgce-application" }
ledgce-domain = { path = "../ledgce-domain" }
rand = "0.8"
rust_decimal = "1.43"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres"] }
time = "0.3"
tokio = { version = "1.54", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.29", features = ["v7"] }

[lints]
workspace = true
