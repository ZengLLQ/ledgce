[package]
name = "ledgce-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
dotenvy = "0.15"
ledgce-application = { path = "../ledgce-application" }
ledgce-domain = { path = "../ledgce-domain" }
ledgce-observability = { path = "../ledgce-observability" }
rust_decimal = { version = "1.43.0", features = ["serde-str"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "rust_decimal"] }
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1.54", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "6.0", features = ["uuid", "time"] }
utoipa-swagger-ui = { version = "10.0", features = ["axum"] }
uuid = { version = "1.29", features = ["v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
