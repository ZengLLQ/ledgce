[workspace]
resolver = "2"
members = [
  "crates/ledgce-domain",
  "crates/ledgce-application",
  "crates/ledgce-observability",
  "crates/ledgce-api",
  "crates/ledgce-worker",
  "crates/ledgce-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"
unwrap_used = "warn"

[profile.release]
lto = "thin"
